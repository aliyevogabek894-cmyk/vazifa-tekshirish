<div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 mb-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex space-x-1 sm:space-x-4 overflow-x-auto py-3 scrollbar-none">
            <a href="{% url 'admin_dashboard' %}" class="flex items-center px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all
                {% if request.resolver_match.url_name == 'admin_dashboard' %}
                    bg-brand-600 text-white shadow-md shadow-brand-600/20
                {% else %}
                    text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700
                {% endif %}">
                <i data-lucide="layout-dashboard" class="w-4 h-4 mr-2"></i>
                Dashboard
            </a>

            <a href="{% url 'admin_reports' %}" class="flex items-center px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all
                {% if request.resolver_match.url_name == 'admin_reports' %}
                    bg-emerald-600 text-white shadow-md shadow-emerald-600/20
                {% else %}
                    text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 hover:bg-emerald-100
                {% endif %}">
                <i data-lucide="file-spreadsheet" class="w-4 h-4 mr-2"></i>
                Hisobotlar & Excel
            </a>

            <a href="{% url 'admin_submissions' %}" class="flex items-center px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all
                {% if request.resolver_match.url_name == 'admin_submissions' or request.resolver_match.url_name == 'admin_review_submission' %}
                    bg-brand-600 text-white shadow-md shadow-brand-600/20
                {% else %}
                    text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700
                {% endif %}">
                <i data-lucide="inbox" class="w-4 h-4 mr-2"></i>
                Tekshirish
            </a>

            <a href="{% url 'admin_assignments' %}" class="flex items-center px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all
                {% if request.resolver_match.url_name == 'admin_assignments' %}
                    bg-brand-600 text-white shadow-md shadow-brand-600/20
                {% else %}
                    text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700
                {% endif %}">
                <i data-lucide="book-marked" class="w-4 h-4 mr-2"></i>
                Vazifalar
            </a>

            <a href="{% url 'admin_students' %}" class="flex items-center px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all
                {% if request.resolver_match.url_name == 'admin_students' %}
                    bg-brand-600 text-white shadow-md shadow-brand-600/20
                {% else %}
                    text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700
                {% endif %}">
                <i data-lucide="users" class="w-4 h-4 mr-2"></i>
                O‘quvchilar
            </a>

            <a href="{% url 'admin_classrooms' %}" class="flex items-center px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all
                {% if request.resolver_match.url_name == 'admin_classrooms' %}
                    bg-brand-600 text-white shadow-md shadow-brand-600/20
                {% else %}
                    text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700
                {% endif %}">
                <i data-lucide="school" class="w-4 h-4 mr-2"></i>
                Sinflar
            </a>

            <a href="{% url 'admin_audit_logs' %}" class="flex items-center px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all
                {% if request.resolver_match.url_name == 'admin_audit_logs' %}
                    bg-brand-600 text-white shadow-md shadow-brand-600/20
                {% else %}
                    text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700
                {% endif %}">
                <i data-lucide="shield-check" class="w-4 h-4 mr-2"></i>
                Audit Log
            </a>
        </div>
    </div>
</div>
